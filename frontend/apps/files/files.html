<div class="files-app">
  <header class="files-toolbar">
    <div class="files-navigation">
      <button
        class="files-icon-btn"
        data-action="back"
        title="Back"
        aria-label="Back"
      >
        ←
      </button>
      <button
        class="files-icon-btn"
        data-action="up"
        title="Parent folder"
        aria-label="Parent folder"
      >
        ↑
      </button>
      <button
        class="files-icon-btn"
        data-action="refresh"
        title="Refresh"
        aria-label="Refresh"
      >
        ⟳
      </button>
    </div>

    <div class="files-address">
      <span class="files-address-icon" aria-hidden="true"></span>
      <nav class="files-breadcrumbs" aria-label="Current path"></nav>
    </div>
  </header>

  <div class="files-actions">
    <button data-action="new-file">New file</button>
    <button data-action="new-folder">New folder</button>
    <button data-action="rename" disabled>Rename</button>
    <button data-action="delete" class="files-danger" disabled>Delete</button>

    <div class="files-search-wrap">
      <input
        class="files-search"
        type="search"
        placeholder="Search this folder…"
        aria-label="Search current folder"
      />
    </div>
  </div>

  <main class="files-main">
    <aside class="files-sidebar">
      <div class="files-sidebar-heading">Locations</div>

      <button class="files-location active" data-location="">
        <span class="files-location-icon" aria-hidden="true">⌂</span>
        Home
      </button>
    </aside>

    <section class="files-content">
      <div class="files-list-header">
        <span>Name</span>
        <span>Type</span>
        <span>Size</span>
        <span>Modified</span>
      </div>

      <div
        class="files-list"
        role="listbox"
        aria-label="Files and folders"
      ></div>

      <div class="files-empty" hidden>
        <div class="files-empty-icon" aria-hidden="true">∅</div>
        <strong>This folder is empty</strong>
        <p>Create a file or folder to get started.</p>
      </div>

      <div class="files-error" role="alert" hidden></div>
      <div class="files-loading" hidden>Loading…</div>
    </section>
  </main>

  <footer class="files-statusbar">
    <span class="files-item-count">Ready</span>
    <span class="files-current-path">/</span>
  </footer>

  <div class="files-dialog-overlay" hidden>
    <form class="files-dialog">
      <h2 class="files-dialog-title">New file</h2>

      <p class="files-dialog-message" hidden></p>

      <input
        class="files-dialog-input"
        type="text"
        autocomplete="off"
        autocapitalize="none"
        spellcheck="false"
      />

      <p class="files-dialog-error" role="alert"></p>

      <div class="files-dialog-actions">
        <button type="button" data-dialog="cancel">Cancel</button>
        <button type="submit" data-dialog="confirm" class="files-primary">
          Create
        </button>
      </div>
    </form>
  </div>
</div>

<div class="settings">
  <div class="settings-sidebar">
    <button class="settings-tab active" data-section="apearance">
      <wa-icon name="paintbrush">Appearance</wa-icon>
    </button>
    <button class="settings-tab" data-section="keyboard">
      <wa-icon name="keyboard">Keyboard</wa-icon>
    </button>
  </div>

  <div class="settings-content">
    <section id="apearance" class="settings-section active">
      <h1>Appearance</h1>

      <div class="setting">
        <div>
          <h2>Terminal Theme</h2>
          <p>Choose the theme for your terminal:</p>
        </div>

        <wa-select id="terminalTheme" value="dark">
          <wa-option value="dark">Dark</wa-option>
          <wa-option value="light">Light</wa-option>
        </wa-select>
      </div>

      <div class="setting">
        <div>
          <h2>Desktop wallpaper</h2>
          <p>Upload an image for the wallpaper</p>
        </div>
        <input id="wallInput" accept="image/*" hidden type="file" />

        <wa-button id="wallButton" apearance="outlined">Choose Image</wa-button>
      </div>

      <div id="wallStatus"></div>
    </section>

    <section id="keyboard" class="settings-section">
      <h1>Keyboard</h1>
      <div class="setting">
        <div>
          <h2>For Dock Toggle</h2>
          <p>
            Your keyboard shortcut for hiding or showing the dock(needed if
            Super D is mapped with something else in your pc)
          </p>
        </div>

        <wa-button id="dockShortcut" apearance="outlined">Super + D</wa-button>
      </div>
    </section>
  </div>
</div>

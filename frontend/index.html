<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VALCON Web OS</title>
    <meta
      name="description"
      content="VALCON — a local-first browser desktop."
    />
    <meta name="color-scheme" content="dark light" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <form id="authGate">
      <div class="auth-wallpaper"></div>
      <div class="auth-overlay"></div>
      <div class="auth-content">
        <div class="auth-card">
          <div class="auth-brand">
            <div class="auth-icon">
              <wa-icon name="terminal"></wa-icon>
            </div>

            <h1>VALCON</h1>
            <p>Web Desktop</p>
          </div>

          <div class="auth-fields">
            <div class="auth-field">
              <label for="authUser">Username</label>

              <input
                id="authUser"
                type="text"
                placeholder="Enter your username"
                autocomplete="username"
                autocapitalize="none"
                spellcheck="false"
                required
              />
            </div>

            <div class="auth-field">
              <label for="authPass">Password</label>

              <input
                id="authPass"
                type="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />
            </div>
          </div>

          <button id="authSubmit" type="submit" class="auth-submit">
            Register
          </button>

          <button id="authSwitch" type="button">
            Already registered? Log in
          </button>

          <p id="authMsg" role="status" aria-live="polite"></p>
        </div>
      </div>
    </form>
    <div id="app" hidden>
      <main id="desktop">
        <div id="wallpaper"></div>
        <nav id="dock" aria-label="Applications">
          <wa-button
            id="terminalApp"
            appearance="plain"
            title="Terminal"
            aria-label="Terminal"
          >
            <wa-icon name="terminal"></wa-icon>
          </wa-button>
          <wa-button
            id="settingsApp"
            appearance="plain"
            title="Settings"
            aria-label="Settings"
          >
            <wa-icon name="gear"></wa-icon>
          </wa-button>
          <wa-button
            id="musicApp"
            appearance="plain"
            title="Music"
            aria-label="Music"
          >
            <wa-icon name="music"></wa-icon>
          </wa-button>
          <wa-button
            id="editorApp"
            appearance="plain"
            title="Editor"
            aria-label="Editor"
          >
            <wa-icon name="file-lines"></wa-icon>
          </wa-button>
          <wa-button
            id="filesApp"
            appearance="plain"
            title="Files"
            aria-label="Files"
          >
            <wa-icon name="folder-open"></wa-icon>
          </wa-button>
        </nav>
      </main>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>

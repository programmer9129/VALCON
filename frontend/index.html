<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VALCON_WEB_Terminal</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <form id="authGate">
      <div class="auth-card">
        <h1>VALCON</h1>
        <p class="auth-subtitle">Web Desktop</p>
        <input
          id="authUser"
          type="text"
          placeholder="Username"
          autocomplete="username"
          required
        />

        <input
          id="authPass"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
          required
        />
        <button id="authSubmit" type="submit">Register</button>

        <button id="authSwitch" type="button">Registered?? Log in</button>
        <p id="authMsg"></p>
      </div>
    </form>
    <wa-page id="app" style="display: none">
      <main id="desktop">
        <div id="wallpaper"></div>
        <div id="dock">
          <wa-button id="terminalApp" appearance="plain">
            <wa-icon name="terminal"></wa-icon>
          </wa-button>
          <wa-button id="settingsApp" appearance="plain">
            <wa-icon name="gear"></wa-icon>
          </wa-button>
        </div>
      </main>
    </wa-page>

    <script type="module" src="script.js"></script>
  </body>
</html>

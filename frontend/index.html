<!doctype html>
<html lang="en">
  <head>
    <title>VALCON_WEB_Terminal</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <div id="tabs">
        <button id="newTerminal">+</button>
      </div>

      <main id="terminal">
        <div id="output"></div>
      </main>

      <footer id="status">
        <span id="conn">
          <span id="connDot"></span>
          <span id="connTxt">Backend: Connected</span>
        </span>
        <span id="currentShell">Shell 1</span>
        <span id="valconVersion">Valcon v0.0001</span>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>

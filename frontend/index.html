<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>VALCON_WEB_Terminal</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <wa-page id="app">
      <main id="desktop">
        <div id="wallpaper"></div>
        <div id="dock">
          <wa-tooltip for="terminalApp">Terminal</wa-tooltip>

          <wa-button
            id="terminalApp"
            appearance="plain"
            size="s"
            aria-label="Terminal"
          >
            <wa-icon name="terminal"></wa-icon>
          </wa-button>
        </div>
      </main>
    </wa-page>

    <script type="module" src="script.js"></script>
  </body>
</html>

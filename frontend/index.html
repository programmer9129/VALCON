<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VALCON_WEB_Terminal</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <form id="authGate">
      <div class="auth-wallpaper"></div>
      <div class="auth-overlay"></div>
      <div class="auth-content">
        <div class="auth-card">
          <div class="auth-brand">
            <div class="auth-icon">
              <wa-icon name="terminal"></wa-icon>
            </div>

            <h1>VALCON</h1>
            <p>Web Desktop</p>
          </div>

          <div class="auth-fields">
            <div class="auth-field">
              <label for="authUser">Username</label>

              <input
                id="authUser"
                type="text"
                placeholder="Enter your username"
                autocomplete="username"
                autocapitalize="none"
                spellcheck="false"
                required
              />
            </div>

            <div class="auth-field">
              <label for="authPass">Password</label>

              <input
                id="authPass"
                type="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />
            </div>
          </div>

          <wa-button id="authSubmit" type="submit" variant="brand" size="large">
            Register
          </wa-button>

          <button id="authSwitch" type="button">
            Already registered? Log in
          </button>

          <p id="authMsg" role="status" aria-live="polite"></p>
        </div>
      </div>
    </form>
    <wa-page id="app" style="display: none">
      <main id="desktop">
        <div id="wallpaper"></div>
        <div id="dock">
          <wa-button id="terminalApp" appearance="plain">
            <wa-icon name="terminal"></wa-icon>
          </wa-button>
          <wa-button id="settingsApp" appearance="plain">
            <wa-icon name="gear"></wa-icon>
          </wa-button>
          <wa-button id="musicApp" appearance="plain">
            <wa-icon name="music"></wa-icon>
          </wa-button>
        </div>
      </main>
    </wa-page>

    <script type="module" src="script.js"></script>
  </body>
</html>
